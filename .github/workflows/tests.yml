name: LinFo tests

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries for Qt offscreen rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: python -m pip install -e .
      - name: Syntax check
        run: python -m compileall -q src privileged/linfo-helper
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Headless scanner smoke test
        run: |
          set +e
          linfo --cli --timeout 60 --output /tmp/linfo-test.json
          result=$?
          set -e
          test "$result" -eq 0 -o "$result" -eq 2
          python -c 'import json; x=json.load(open("/tmp/linfo-test.json")); assert x["findings"] and not x["cancelled"]'
      - name: Cancelled CLI preserves partial report and returns 130
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import selectors
          import signal
          import subprocess
          import sys
          import tempfile

          with tempfile.TemporaryDirectory(prefix="linfo-cancel-") as folder:
              output = Path(folder) / "partial.json"
              process = subprocess.Popen(
                  [sys.executable, "-m", "linfo", "--cli", "--timeout", "60", "--output", str(output)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True,
              )
              try:
                  with selectors.DefaultSelector() as selector:
                      selector.register(process.stderr, selectors.EVENT_READ)
                      assert selector.select(15), "CLI did not announce assessment startup"
                      assert "Collecting" in process.stderr.readline(), "CLI failed before starting its assessment"
                  process.send_signal(signal.SIGINT)
                  _, diagnostics = process.communicate(timeout=15)
                  assert process.returncode == 130, (process.returncode, diagnostics)
                  report = json.loads(output.read_text())
                  assert report["cancelled"] and report["incomplete"], report
              finally:
                  if process.poll() is None:
                      process.kill()
                      process.communicate(timeout=5)
          PY
      - name: GUI startup smoke test (offscreen)
        run: |
          python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from linfo.gui import MainWindow
          app = QApplication([])
          w = MainWindow('workstation')
          assert w.windowTitle().startswith('LinFo')
          w.close()
          PY
