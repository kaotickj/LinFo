name: Build LinFo Linux executable

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux desktop runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . 'pyinstaller>=6.16,<7'
      - name: Build standalone desktop executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LinFo --collect-all PyQt6 linfo_launcher.py
      - name: Smoke-test binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/LinFo --version
          set +e
          ./dist/LinFo --cli --output /tmp/linfo-binary-audit.json
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 2
          python -c 'import json; assert json.load(open("/tmp/linfo-binary-audit.json"))["findings"]'
          set +e
          timeout 10s ./dist/LinFo > /tmp/linfo-gui-smoke.log 2>&1
          gui_code=$?
          set -e
          if [ "$gui_code" -ne 124 ]; then
            cat /tmp/linfo-gui-smoke.log
            echo "GUI exited unexpectedly: $gui_code"
            exit 1
          fi
      - name: Assemble Linux archive
        run: |
          mkdir -p release/LinFo-Linux-x86_64/privileged release/LinFo-Linux-x86_64/scripts
          install -m 0755 dist/LinFo release/LinFo-Linux-x86_64/LinFo
          install -m 0755 privileged/linfo-helper release/LinFo-Linux-x86_64/privileged/linfo-helper
          install -m 0755 scripts/install-helper.sh release/LinFo-Linux-x86_64/scripts/install-helper.sh
          cp README.md release/LinFo-Linux-x86_64/
          if [ -f LICENSE ]; then cp LICENSE release/LinFo-Linux-x86_64/; fi
          cat > release/LinFo-Linux-x86_64/LinFo.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=LinFo Security Hardening
          Comment=Linux security inventory and hardening
          Exec=LinFo
          Terminal=false
          Categories=System;Security;
          DESKTOP
          tar -czf LinFo-Linux-x86_64.tar.gz -C release LinFo-Linux-x86_64
          sha256sum LinFo-Linux-x86_64.tar.gz > LinFo-Linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LinFo-Linux-x86_64
          path: |
            LinFo-Linux-x86_64.tar.gz
            LinFo-Linux-x86_64.tar.gz.sha256
          retention-days: 30
